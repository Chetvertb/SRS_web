<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Повторение карточек</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container">
      <h1>Повторение карточек</h1>
      <button id="startRpt">Начать</button>

      <div class="card-box">
        <h3 id="question-title">Вопрос:</h3>
        <span id="questionRpt">Нажмите кнопку начать</span>
        
        <h3 id="answer-title">Ответ:</h3>
        <span id="answerRpt">Здесь появится ответ</span>
      </div>

      <div class="radio-block">
        <label><input type="radio" name="mark" id="5">5</label>

        <label><input type="radio" name="mark" id="4" checked>4</label>

        <label><input type="radio" name="mark" id="3">3</label>

        <label><input type="radio" name="mark" id="2">2</label>
      </div>

      <div class="button-repeat">
        <button id="showAnswerRpt">Показать ответ</button>
        <button id="nextCardBtnRpt">Следующая</button>
      </div>
      <a href="index.html">⬅️ Назад в меню</a>
      <!-- Комментарий -->
    </div>
  </body>
  <script src="/static/script.js"></script>
</html>
