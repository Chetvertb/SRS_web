<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Повторение карточек</title>
  </head>
  <body>
    <div class="container"
      <h1>Повторение карточек</h1><p></p>
      <button id="startRpt">Начать</button><p></p>

      <div class="card-box">
        <h3 id="question-title">Вопрос:</h3>
        <p id="questionRpt">Нажмите кнопку начать</p>
        
        <h3 id="answer-title">Ответ:</h3>
        <p id="answerRpt">Здесь появится ответ</p>
    

        <input type="radio" name="mark" id="5">
        <label for="5">5</label><br>

        <input type="radio" name="mark" id="4" checked>
        <label for="4">4</label><br>

        <input type="radio" name="mark" id="3">
        <label for="3">3</label><br>

        <input type="radio" name="mark" id="2">
        <label for="2">2</label><br>
        
        <br>
        <button id="showAnswerRpt">Показать ответ</button>
        <button id="nextCardBtnRpt">Следующая</button><p></p>

      </div>  
      <a href="index.html">⬅️ Назад в меню</a>
      <!-- Комментарий -->
    </div class="container">
  </body>
  <script src="/static/script.js"></script>
</html>
