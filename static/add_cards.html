<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить карточку</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Добавление карточки</h1>

    <div class="form">
      <label for="deck-id">Номер колоды (JSON):</label>
      <input type="number" id="deck-id" value="2" min="1">
      <input type="text" id="question" placeholder="Вопрос">
      <input type="text" id="answer" placeholder="Ответ">
      <button id="save-btn">Сохранить</button>
    </div>
    <p><a href="/">⬅️ Назад в меню</a></p>
  </div>
  <script src="/static/script.js"></script>

    <!-- Комментарий -->
    <p>Первый абзац.</p>
    <p>Второй абзац.</p>
  </body>
</html>
